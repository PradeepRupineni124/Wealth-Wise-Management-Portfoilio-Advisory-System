<div class="login_wrapper">
  <div class="login_card">
    <!-- Back button -->
    <button class="back-btn" routerLink="/">
      ← Back
    </button>

    <h2>Login to Your Account</h2>

    <div class="form_group">
      <!-- Email -->
      <p-floatLabel>
        <input
          pInputText
          id="email"
          [(ngModel)]="values"
          autocomplete="off"
          type="email"
        />
        <label for="email">Email</label>
      </p-floatLabel>

      <!-- Password -->
      <p-floatLabel>
        <p-password
          inputId="password"
          [(ngModel)]="value"
          [toggleMask]="true"
          [feedback]="true"
          promptLabel="Enter password"
          weakLabel="Weak"
          mediumLabel="Medium"
          strongLabel="Strong"
        ></p-password>
        <label for="password">Password</label>
      </p-floatLabel>

      <!-- Login button -->
      <p-button label="Sign In" styleClass="login-btn"></p-button>

      <!-- Signup link -->
      <p class="signup-text">
        Don’t have an account?
        <span routerLink="/register">Sign up</span>
      </p>
    </div>
  </div>
</div>
