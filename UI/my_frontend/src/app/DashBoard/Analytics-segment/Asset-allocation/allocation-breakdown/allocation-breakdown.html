<div class="allocation-breakdown-card">
  <h3 class="card-title">Allocation Breakdown</h3>

  <div class="breakdown-list">
    @for (sector of sectors; track sector.name) {
      <div class="sector-item mb-4">
        <div class="flex justify-content-between align-items-center mb-2">
          <div class="flex align-items-center gap-2">
            <span class="color-dot" [style.background-color]="sector.color"></span>
            <span class="sector-name text-900 font-medium">{{ sector.name }}</span>
          </div>
          <span class="sector-value font-bold text-900">{{ sector.value }}%</span>
        </div>

        <div class="progress-track">
          <div 
            class="progress-fill" 
            [style.width.%]="sector.value" 
            [style.background-color]="sector.color">
          </div>
        </div>
      </div>
    }
  </div>
</div>
