<div class="card-container">
  <div class="avatar">
    {{ getInitials() }}
  </div>

  <div class="content">
    <h2 class="name">{{ name }}</h2>
    <p class="sub-text">Client • {{ clientId }}</p>

    <div class="badge-group">
      <span class="badge badge-green">Risk Profile: {{ riskProfile }}</span>
      <span class="badge badge-blue">Goal: {{ goal }}</span>
      <span *ngIf="isVerified" class="badge badge-purple">Verified Client</span>
    </div>
  </div>
</div>
