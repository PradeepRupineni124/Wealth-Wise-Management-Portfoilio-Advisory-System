<aside class="sidebar-container">
  <nav class="nav-menu">
    <ul>
      <li *ngFor="let item of menuItems">
        <a 
          [routerLink]="item.route" 
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{exact: false}"
          class="nav-link">
          
          <i [class]="item.icon"></i>
          <span class="link-text">{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </nav>
</aside>
