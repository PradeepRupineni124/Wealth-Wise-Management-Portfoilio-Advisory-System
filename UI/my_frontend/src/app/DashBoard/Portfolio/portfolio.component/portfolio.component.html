<div class="portfolio-container">

  <div *ngIf="!currentClientId" class="empty-state-container">
    <i class="pi pi-users empty-icon"></i>
    <h3>No Client Selected</h3>
    <p>Please select an existing client from the search bar above, or click "Add New Client" to get started.</p>
  </div>

  <ng-container *ngIf="currentClientId">
    <header class="portfolio-header">
      <div class="header-text">
        <h2>Portfolio Holdings</h2>
        <p>Manage and track your investment portfolio</p>
      </div>
      <button class="trigger-add-btn" (click)="addInvestmentModal.showDialog()">
        <i class="pi pi-plus"></i> Add Investment
      </button>
    </header>

    <div class="dashboard-wrapper">
      <section class="summary-grid">
        <app-portfolio-card *ngFor="let s of portfolioStats" 
          [title]="s.title" [value]="s.value" [valueColor]="s.color">
        </app-portfolio-card>
      </section>

      <section class="table-section">
        <app-portfolio-table [rowData]="portfolioData"></app-portfolio-table>
      </section>

      <section class="summary-box">
        <app-portfolio-card *ngFor="let a of assetClasses" 
          [title]="a.title" 
          [value]="a.value" 
          [badgeText]="a.badgeText" [badgeBgColor]="a.badgeBgColor" 
          [trendText]="a.trendText" [trendColor]="a.trendColor">
        </app-portfolio-card>
      </section>
    </div>

    <app-add-investment 
        #addInvestmentModal 
        [totalPortfolioValue]="currentTotalValue" 
        (investmentAdded)="onInvestmentAdded($event)">
    </app-add-investment>
  </ng-container>

</div>
<p-toast position="bottom-right"></p-toast>
