<div class="portfolio-table-container">
  <div class="portfolio-table-header">
    <div class="search-wrapper">
      <i class="pi pi-search"></i>
      <input type="text" class="search-input" [(ngModel)]="searchText" (input)="onSearch()" 
             placeholder="Search by symbol or name...">
    </div>

    <div class="filter-tabs">
      <button *ngFor="let tab of ['All', 'Equities', 'Bonds', 'Mutual Funds']"
              [class.active]="activeTab === tab" (click)="setFilter(tab)">
        {{ tab }}
      </button>
    </div>
  </div>

  <div class="grid-wrapper">
    @if (isBrowser) {
      <ag-grid-angular
        style="width: 100%;" 
        class="ag-theme-alpine portfolio-grid"
        [rowData]="rowData" 
        [columnDefs]="colDefs" 
        [defaultColDef]="defaultColDef"
        [domLayout]="'autoHeight'" 
        [animateRows]="true" 
        
        [pagination]="true"
        [paginationPageSize]="5"
        [paginationPageSizeSelector]="[5, 10, 20]"
        
        (gridReady)="onGridReady($event)">
      </ag-grid-angular>
    } @else {
      <div class="loading-state">
        <i class="pi pi-spin pi-spinner"></i> Initializing Portfolio...
      </div>
    }
  </div>
</div>
