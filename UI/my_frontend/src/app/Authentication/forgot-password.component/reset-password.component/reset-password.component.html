<p-toast position="top-right"></p-toast>

<div class="wealth-wrapper">
    <div class="wealth-card">
        <p-card>
            <form [formGroup]="resetForm" (ngSubmit)="onReset()">
                <h2 class="wealth-title">New Password</h2>
                
                <div class="form-field">
                    <label class="field-label">Password</label>
                    <p-password formControlName="password" [toggleMask]="true" [feedback]="false" 
                        styleClass="full-width-pass" [inputStyle]="{ width: '100%' }" 
                        placeholder="Enter new password"/>
                </div>

                <div class="form-field">
                    <label class="field-label">Confirm Password</label>
                    <p-password formControlName="confirmPassword" [toggleMask]="true" [feedback]="false" 
                        styleClass="full-width-pass" [inputStyle]="{ width: '100%' }" 
                        placeholder="Confirm new password"/>
                </div>

                <div class="error-placeholder">
                    @if (resetForm.hasError('mismatch') && resetForm.get('confirmPassword')?.touched) {
                        <small class="p-error">Passwords do not match.</small>
                    }
                </div>

                <div class="button-row">
                    <p-button label="Update Password" type="submit" styleClass="wealth-btn"
                        [loading]="isLoading()"
                        [disabled]="resetForm.invalid">
                    </p-button>
                </div>
            </form>
        </p-card>
    </div>
</div>
