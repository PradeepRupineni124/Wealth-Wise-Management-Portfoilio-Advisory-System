server:
  port: 8070

spring:
  application:
    name: analytics-service

  # --- Database Configuration ---
  datasource:
    url: jdbc:mysql://localhost:3306/finance_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10 # Optional pool settings

  # --- JPA / Hibernate Configuration ---
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: false

  # --- OpenFeign & Circuit Breaker ---
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 5000

# --- Eureka Discovery Client ---
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    # TIP: If you get "Connection timed out" errors again because of Wi-Fi changes,
    # change prefer-ip-address to 'false' and add 'hostname: localhost' here!