spring:
  application:
    name: wealth-analytics-service
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 5000
  datasource:
    url: jdbc:mysql://localhost:3306/finance_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Optional pool settings (HikariCP defaults)
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: false
  web:
    cors:
      allowed-origins: "http://localhost:3000,http://localhost:4200"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: LTIN656497.cts.com
    prefer-ip-address: false
    instance-id: ${eureka.instance.hostname}:${spring.application.name}
