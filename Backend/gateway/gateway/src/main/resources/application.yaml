server:
  port: 9090

spring:
  application:
    name: gateway-service
  # Notice: The cloud.gateway.globalcors section is completely removed!

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info
  endpoint:
    gateway:
      enabled: true



logging:
   level:
     root: INFO
     # Only keep DEBUG for your specific project files if you need them
     com.Wealth: DEBUG